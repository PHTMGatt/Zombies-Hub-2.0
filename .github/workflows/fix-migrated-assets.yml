name: Fix migrated asset paths

on:
  push:
    paths:
      - '.github/workflows/fix-migrated-assets.yml'

permissions:
  contents: write

jobs:
  fix-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize legacy asset paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in Path('maps/revelations/src/styles').glob('*.css'):
              text = path.read_text()
              text = text.replace("url('/src/assets/", "url('../assets/")
              text = text.replace('url("/src/assets/', 'url("../assets/')
              path.write_text(text)

          origins = Path('maps/origins/src/Styles/global.css')
          if origins.exists():
              text = origins.read_text().replace("url('/images/Robot.webp')", "url('../../public/images/Robot.webp')")
              origins.write_text(text)
          PY

      - name: Commit normalized assets
        run: |
          git config user.name 'Zombies Hub 2.0 Migration'
          git config user.email 'actions@users.noreply.github.com'
          git add maps/revelations/src/styles maps/origins/src/Styles/global.css
          if git diff --cached --quiet; then
            echo 'No asset path changes required.'
            exit 0
          fi
          git commit -m 'Fix migrated map asset paths'
          git pull --rebase origin main
          git push origin main
