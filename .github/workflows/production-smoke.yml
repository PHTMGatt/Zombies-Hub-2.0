name: Production Smoke

on:
  workflow_run:
    workflows: ['Build Zombies Hub 2.0']
    types: [completed]
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL to verify
        required: true
        default: https://zombies-hub-2-0.onrender.com
        type: string
      expected_sha:
        description: Optional commit SHA that should be live
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Render and verify critical production routes
        env:
          ZH_SMOKE_BASE_URL: ${{ inputs.base_url || 'https://zombies-hub-2-0.onrender.com' }}
          ZH_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.expected_sha }}
        run: node scripts/smoke-live.mjs
