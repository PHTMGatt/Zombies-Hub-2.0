name: Visual QA Screenshots

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Live site URL to capture
        required: true
        default: https://zombies-hub-2-0.onrender.com
        type: string
      expected_sha:
        description: Optional deployed commit SHA to wait for before capture
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: visual-qa
  cancel-in-progress: true

jobs:
  capture-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Confirm live deployment
        env:
          ZH_SMOKE_BASE_URL: ${{ inputs.base_url }}
          ZH_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: npm run smoke

      - name: Install Chromium for visual QA
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture desktop and mobile pages
        env:
          ZH_SCREENSHOT_BASE_URL: ${{ inputs.base_url }}
          ZH_SCREENSHOT_DIR: screenshots
        run: node scripts/capture-live-screenshots.mjs

      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zombies-hub-visual-qa-${{ github.run_number }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 3
