name: Generate root package lock

on:
  push:
    paths:
      - '.github/workflows/generate-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit root lockfile
        run: |
          git config user.name 'Zombies Hub DevOps'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Root lockfile already current.'
            exit 0
          fi
          git commit -m 'Add deterministic root dependency lockfile'
          git pull --rebase origin main
          git push origin main
