name: Build Zombies Hub 2.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zombies-hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Source verification
        run: npm run check

      - name: Production compile
        run: npm run compile

      - name: Upload production bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zombies-hub-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
