name: Build Zombies Hub 2.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zombies-hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Source verification
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production compile
        run: npm run compile

      - run: npx playwright install --with-deps chromium

      - name: Browser route regression checks
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          npm run test:browser

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-route-report
          path: artifacts/browser-smoke.json

      - name: Upload production bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zombies-hub-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
