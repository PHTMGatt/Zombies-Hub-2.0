# security-med
# MED: nightly and manual. Adds full-history secret scan, dependency review and the red-team tests.
# Schedule and manual runs only exist once this file is on the default branch; until then it also runs
# when claude-forge changes this file, so it is proven green first.
# Logic lives in security-pipeline.yml; this file only picks the level.
name: security-med

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [claude-forge]
    paths: ['.github/workflows/security-med.yml']

permissions:
  contents: read

concurrency:
  group: security-med-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/security-pipeline.yml
    with:
      level: "med"
      node-version: "22"
      audit-dirs: "."
      prepare-command: "npm ci --no-audit --no-fund && npm run compile"
      start-command: "npx vite preview --host 127.0.0.1 --port 4173"
      target-url: "http://127.0.0.1:4173"
