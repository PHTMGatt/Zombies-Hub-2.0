version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Detroit
    # Permanent branch policy allows only main, chatgpt-forge, and claude-forge.
    # Dependabot PRs create additional branches, so keep automated PR creation disabled.
    open-pull-requests-limit: 0
    groups:
      runtime-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:15"
      timezone: America/Detroit
    # See branch-policy note above.
    open-pull-requests-limit: 0
