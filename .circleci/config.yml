# DRAFT: Zombies Hub CircleCI red-ops, complementary to the existing GitHub Actions security workflows.
# Owner-approved ISOLATED branch. CircleCI project NOT enabled; no runs, secrets, deploys or live targets.
# Manual trigger classification (pipeline.trigger_source=api) needs an owner-approved live pilot.
version: 2.1
parameters:
  level:
    type: enum
    enum: [low, med, high]
    default: low
  run_live_probe:
    type: boolean
    default: false
executors:
  node:
    docker:
      - image: cimg/node:22
    resource_class: small
  local-vm:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
commands:
  permit:
    steps:
      - run:
          name: Credit gate - API/manual or PR labelled run-ci only
          environment:
            SCAN_LEVEL: << pipeline.parameters.level >>
            TRIGGER: << pipeline.trigger_source >>
            LIVE_PROBE: << pipeline.parameters.run_live_probe >>
          command: |
            set -eu
            if [ "$LIVE_PROBE" = "true" ]; then echo "No live probing implemented. Refusing."; exit 1; fi
            if [ "$TRIGGER" = "api" ]; then echo "API/manual trigger accepted"; exit 0; fi
            if [ "$SCAN_LEVEL" != "low" ]; then
              echo "MED/HIGH requires manual API trigger; skipping"
              circleci-agent step halt
              exit 0
            fi
            # The label check is unauthenticated and fails closed on unavailable data.
            url="https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/commits/$CIRCLE_SHA1/pulls"
            if ! curl --max-time 15 -fsSL -H 'Accept: application/vnd.github+json' "$url" -o /tmp/circleci-prs.json; then
              echo "GitHub PR label could not be verified. Stop."
              circleci-agent step halt
              exit 0
            fi
            if jq -e '.[] | select(.state == "open") | .labels[]? | select(.name == "run-ci")' /tmp/circleci-prs.json >/dev/null; then
              echo "run-ci PR label confirmed"
            else
              echo "No open labelled PR. Stop before scans."
              circleci-agent step halt
            fi
  gitleaks:
    steps:
      - run:
          name: Download and verify fixed gitleaks version
          command: |
            set -eu
            mkdir -p "$HOME/bin" /tmp/ci-gitleaks
            cd /tmp/ci-gitleaks
            base="https://github.com/gitleaks/gitleaks/releases/download/v8.21.2"
            curl -fsSLO "$base/gitleaks_8.21.2_linux_x64.tar.gz"
            curl -fsSLO "$base/gitleaks_8.21.2_checksums.txt"
            grep ' gitleaks_8.21.2_linux_x64.tar.gz$' gitleaks_8.21.2_checksums.txt | sha256sum -c -
            tar -xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks
            mv gitleaks "$HOME/bin/gitleaks"
            echo 'export PATH="$HOME/bin:$PATH"' >> "$BASH_ENV"
jobs:
  low:
    executor: node
    steps:
      - permit
      - checkout
      - gitleaks
      - run:
          name: Secrets, production dependency audit, config policy
          command: |
            set -eu
            gitleaks dir . --config .gitleaks.toml --redact --no-banner
            for d in .; do
              (cd "$d" && npm audit --omit=dev --audit-level=high)
            done
            node .github/scripts/check-config.mjs .
      - run:
          name: Install, build and unit/security regression tests
          command: |
            set -eu
            npm ci --no-fund --no-audit
            npm test && npm run build
  med:
    executor: node
    steps:
      - permit
      - checkout
      - run:
          name: Fetch full history
          command: git fetch --unshallow origin || git fetch origin
      - gitleaks
      - run:
          name: All-history secret audit and lockfile-source review
          command: |
            set -eu
            gitleaks git . --config .gitleaks.toml --redact --no-banner
            for d in .; do
              (cd "$d" && npm audit --audit-level=high) || echo "Review nonprod advisories for $d in SECURITY_REPORT.md"
              bad=$(grep -E '"resolved": "' "$d/package-lock.json" | grep -v 'https://registry.npmjs.org/' | grep -vE '"resolved": "(file:.*)?"' || true)
              if [ -n "$bad" ]; then echo "Unexpected dependency source in $d"; exit 1; fi
            done
      - run:
          name: Auth and security regression tests
          command: |
            set -eu
            npm ci --no-fund --no-audit
            npm test
  high:
    executor: local-vm
    steps:
      - permit
      - checkout
      - run:
          name: Start isolated local static preview without database or credentials
          command: |
            set -eu
            docker run -d --name circleci-local --network host -v "$PWD:/app" -w /app node:22-bookworm \
              sh -c 'npm ci --no-fund --no-audit && npm run compile && npx vite preview --host 127.0.0.1 --port 4173'
            ok=0
            for i in $(seq 1 120); do
              status=$(curl --max-time 3 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/ || true)
              if [ "$status" = 200 ]; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then docker logs --tail 60 circleci-local; exit 1; fi
      - run:
          name: Passive ZAP baseline on 127.0.0.1 only
          command: |
            set -eu
            mkdir -p zap && chmod 777 zap
            docker run --rm --network host -u root -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.1 \
              zap-baseline.py -t http://127.0.0.1:4173/ -J report.json -r report.html -I -m 3
            highs=$(jq '[.site[]?.alerts[]? | select((.riskcode | tonumber) >= 3)] | length' zap/report.json)
            if [ "$highs" != 0 ]; then echo "NO-GO: $highs high-risk findings"; exit 1; fi
      - store_artifacts:
          path: zap
          destination: local-only-zap
workflows:
  low:
    when:
      equal: [low, << pipeline.parameters.level >>]
    jobs:
      - low
  med:
    when:
      and:
        - equal: [api, << pipeline.trigger_source >>]
        - equal: [med, << pipeline.parameters.level >>]
    jobs:
      - low
      - med:
          requires: [low]
  high:
    when:
      and:
        - equal: [api, << pipeline.trigger_source >>]
        - equal: [high, << pipeline.parameters.level >>]
    jobs:
      - low
      - med:
          requires: [low]
      - high:
          requires: [med]
